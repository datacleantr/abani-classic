name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm exec tsc -- --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        # Not: tüm veri sayfaları force-dynamic olduğu için build DATABASE_URL gerektirmez.
        # Veritabanı URL'si yalnızca çalışma zamanında (runtime) gereklidir.
